[program:bgp_monitoring]
# --sleeptimeok is the Daemonizer's own poll interval, not the BGP check
# interval -- bgpmon.py's own MAX_CHECK_INTERVAL (3600s) is the ceiling on
# the actual (expensive) ansible sweep. This loop just needs to be short
# enough to notice an activeDeltas change and react promptly, per
# BGPMonitoring's own change-detection in startwork().
command=bash -c "sleep 10 && BGPMonitoring-update --action start --sleeptimeok 60"
priority=-1
stdout_logfile=/var/log/supervisor/bgp_monitoring-daemon.log
stdout_logfile_maxbytes=25MB
stdout_logfile_backups=2
redirect_stderr=true
umask=0002
