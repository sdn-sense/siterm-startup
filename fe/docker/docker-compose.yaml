# SiteRM Frontend split into one container per component.
# Components talk only through MariaDB (frontends also share the JWT signing
# key through it); no volume is shared between them.
#
# Usage (from this directory, after filling ../conf/environment, ../conf/etc/siterm.yaml,
# ../conf/etc/ansible-conf.yaml, ../conf/etc/secret-mount/tls.{crt,key}):
#   docker compose --env-file ../conf/environment up -d
#   docker compose --env-file ../conf/environment up -d --scale snmpmon=2 --scale switchmanager=2
#
# Scalable: switchmanager, snmpmon, bgpmon (devices are split between replicas), frontend (needs a
# load balancer in front when more than one; with compose keep one, or run it in Kubernetes).
# lookup, policy, provisioning, validator, dbworker, debugger run one active instance; extra
# replicas wait as standby and take over within ~60s if the active one stops.
#
# MARIA_DB_USER must be root (the MariaDB image creates the root password and the database).
# Migrating from the single container (run.sh): start the new single-container image once so the
# database upgrade can read the old files under /opt/siterm, then switch to this file pointing
# MariaDB at the old data, or start fresh.

x-siterm: &siterm
  image: quay.io/sdnsense/siterm-fe:${SITERM_VERSION:-latest}
  env_file: ../conf/environment
  restart: unless-stopped
  volumes:
    - ../conf/etc/siterm.yaml:/etc/siterm.yaml:ro
    - ../conf/etc/ansible-conf.yaml:/etc/ansible-conf.yaml:ro
    - ../conf/etc/secret-mount/:/etc/secret-mount/:ro
    - ../conf/opt/siterm/config/ssh-keys:/opt/siterm/config/ssh-keys:ro
  depends_on:
    dbinit:
      condition: service_completed_successfully

services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIA_DB_PASSWORD:?set MARIA_DB_PASSWORD in ../conf/environment and pass --env-file}
      MARIADB_DATABASE: ${MARIA_DB_DATABASE:-sitefe}
    volumes:
      - siterm-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30

  dbinit:
    <<: *siterm
    restart: "no"
    environment: {SITERM_COMPONENT: dbinit, MARIA_DB_HOST: mariadb}
    volumes: []
    depends_on:
      mariadb:
        condition: service_healthy

  frontend:
    <<: *siterm
    environment: {SITERM_COMPONENT: frontend, MARIA_DB_HOST: mariadb}
    ports:
      - "8080:80"
      - "8443:443"

  configfetcher:
    <<: *siterm
    environment: {SITERM_COMPONENT: configfetcher, MARIA_DB_HOST: mariadb}

  lookup:
    <<: *siterm
    environment: {SITERM_COMPONENT: lookup, MARIA_DB_HOST: mariadb}

  policy:
    <<: *siterm
    environment: {SITERM_COMPONENT: policy, MARIA_DB_HOST: mariadb}

  provisioning:
    <<: *siterm
    environment: {SITERM_COMPONENT: provisioning, MARIA_DB_HOST: mariadb}

  switchmanager:
    <<: *siterm
    environment: {SITERM_COMPONENT: switchmanager, MARIA_DB_HOST: mariadb, SITERM_INSTANCE: hostname}

  snmpmon:
    <<: *siterm
    environment: {SITERM_COMPONENT: snmpmon, MARIA_DB_HOST: mariadb, SITERM_INSTANCE: hostname}

  bgpmon:
    <<: *siterm
    environment: {SITERM_COMPONENT: bgpmon, MARIA_DB_HOST: mariadb, SITERM_INSTANCE: hostname}

  validator:
    <<: *siterm
    environment: {SITERM_COMPONENT: validator, MARIA_DB_HOST: mariadb}

  dbworker:
    <<: *siterm
    environment: {SITERM_COMPONENT: dbworker, MARIA_DB_HOST: mariadb}

  debugger:
    <<: *siterm
    environment: {SITERM_COMPONENT: debugger, MARIA_DB_HOST: mariadb}

volumes:
  siterm-mysql:
